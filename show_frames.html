<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Frames</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #fff;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .frame-card {
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .frame-card img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .frame-title {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Extracted Video Frames</h1>
    <div class="grid" id="grid">
        <!-- Frames will be loaded here -->
    </div>

    <script>
        const grid = document.getElementById('grid');
        const frameCount = 45;
        const frames = [
            "frame_000_time_0.0.png", "frame_001_time_0.5.png", "frame_002_time_1.0.png", "frame_003_time_1.5.png",
            "frame_004_time_1.9.png", "frame_005_time_2.4.png", "frame_006_time_2.9.png", "frame_007_time_3.4.png",
            "frame_008_time_3.9.png", "frame_009_time_4.4.png", "frame_010_time_4.8.png", "frame_011_time_5.3.png",
            "frame_012_time_5.8.png", "frame_013_time_6.3.png", "frame_014_time_6.8.png", "frame_015_time_7.3.png",
            "frame_016_time_7.7.png", "frame_017_time_8.2.png", "frame_018_time_8.7.png", "frame_019_time_9.2.png",
            "frame_020_time_9.7.png", "frame_021_time_10.2.png", "frame_022_time_10.6.png", "frame_023_time_11.1.png",
            "frame_024_time_11.6.png", "frame_025_time_12.1.png", "frame_026_time_12.6.png", "frame_027_time_13.1.png",
            "frame_028_time_13.5.png", "frame_029_time_14.0.png", "frame_030_time_14.5.png", "frame_031_time_15.0.png",
            "frame_032_time_15.5.png", "frame_033_time_16.0.png", "frame_034_time_16.4.png", "frame_035_time_16.9.png",
            "frame_036_time_17.4.png", "frame_037_time_17.9.png", "frame_038_time_18.4.png", "frame_039_time_18.9.png",
            "frame_040_time_19.3.png", "frame_041_time_19.8.png", "frame_042_time_20.3.png", "frame_043_time_20.8.png",
            "frame_044_time_21.3.png"
        ];

        frames.forEach(f => {
            const card = document.createElement('div');
            card.className = 'frame-card';
            card.innerHTML = `
                <img src="video_frames/${f}" alt="${f}">
                <div class="frame-title">${f}</div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
